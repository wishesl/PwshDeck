<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2740"/>
      <stop offset="0.5" stop-color="#131b30"/>
      <stop offset="1" stop-color="#090d17"/>
    </linearGradient>
    <radialGradient id="ambientBlue" cx="0.40" cy="0.34" r="0.72">
      <stop offset="0" stop-color="#5f6dff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5f6dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientCyan" cx="0.68" cy="0.64" r="0.55">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.30" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
    <linearGradient id="prompt" x1="120" y1="140" x2="290" y2="372" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9cc2ff"/>
      <stop offset="0.45" stop-color="#8db8ff"/>
      <stop offset="0.7" stop-color="#8a6bff"/>
      <stop offset="1" stop-color="#7c5bff"/>
    </linearGradient>
    <linearGradient id="bolt" x1="208" y1="205" x2="242" y2="262" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8df3e2"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8df3e2"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="blur16" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="blur9" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="blur7" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="blur5" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#ambientBlue)"/>
  <rect width="512" height="512" fill="url(#ambientCyan)"/>
  <rect width="512" height="512" fill="url(#topSheen)"/>
  <rect width="512" height="512" fill="url(#vignette)"/>

  <g opacity="0.85">
    <path d="M388 84 L332 150 L448 150 Z" fill="none" stroke="#2dd4bf" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" filter="url(#blur7)" opacity="0.4"/>
    <path d="M388 84 L332 150 L448 150 Z" fill="none" stroke="#2dd4bf" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <circle cx="388" cy="84" r="16" fill="#2dd4bf" filter="url(#blur7)" opacity="0.55"/>
  <circle cx="332" cy="150" r="16" fill="#2dd4bf" filter="url(#blur7)" opacity="0.55"/>
  <circle cx="448" cy="150" r="16" fill="#2dd4bf" filter="url(#blur7)" opacity="0.55"/>
  <circle cx="388" cy="84" r="16" fill="url(#nodeGrad)"/>
  <circle cx="332" cy="150" r="16" fill="url(#nodeGrad)"/>
  <circle cx="448" cy="150" r="16" fill="url(#nodeGrad)"/>

  <path d="M120 140 L290 256 L120 372" fill="none" stroke="#7d5cff" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" filter="url(#blur16)" opacity="0.5"/>
  <path d="M120 140 L290 256 L120 372" fill="none" stroke="url(#prompt)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M239.3 205.4 L208.5 243.9 L222.8 243.9 L212.9 261.5 L241.5 228.5 L228.3 228.5 L234.9 205.4 Z" fill="none" stroke="#2dd4bf" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#blur5)" opacity="0.5"/>
  <path d="M239.3 205.4 L208.5 243.9 L222.8 243.9 L212.9 261.5 L241.5 228.5 L228.3 228.5 L234.9 205.4 Z" fill="none" stroke="url(#bolt)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="360" y="245" width="58" height="22" rx="11" fill="#2dd4bf" filter="url(#blur9)" opacity="0.55"/>
  <rect x="360" y="245" width="58" height="22" rx="11" fill="#2dd4bf"/>
