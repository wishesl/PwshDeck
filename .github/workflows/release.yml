name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.15
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build
        run: wails3 build

      - name: Package (zip + checksum)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "PwshDeck-$tag-windows-amd64.zip"
          Compress-Archive -Path bin\PwshDeck.exe -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -FilePath "$zip.sha256" -Encoding ascii
          Write-Host "Artifact: $zip"
          Write-Host "SHA256: $hash"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            PwshDeck-${{ github.ref_name }}-windows-amd64.zip
            PwshDeck-${{ github.ref_name }}-windows-amd64.zip.sha256
