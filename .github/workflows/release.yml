name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: windows-amd64
          - os: ubuntu-latest
            suffix: linux-amd64
          - os: macos-latest
            suffix: darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.15
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev zip

      - name: Build
        run: wails3 build

      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        run: wails3 task darwin:package

      - name: Package (zip + checksum) — Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "PwshDeck-$tag-windows-amd64.zip"
          Compress-Archive -Path bin\PwshDeck.exe -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -FilePath "$zip.sha256" -Encoding ascii
          Write-Host "Artifact: $zip"
          Write-Host "SHA256: $hash"

      - name: Package (zip + checksum) — Linux
        if: runner.os == 'Linux'
        run: |
          tag="${{ github.ref_name }}"
          zip="PwshDeck-$tag-linux-amd64.zip"
          (cd bin && zip -q "../$zip" PwshDeck)
          shasum -a 256 "$zip" | awk '{print $1 "  " $2}' > "$zip.sha256"
          echo "Artifact: $zip"
          cat "$zip.sha256"

      - name: Package (zip + checksum) — macOS
        if: runner.os == 'macOS'
        run: |
          tag="${{ github.ref_name }}"
          zip="PwshDeck-$tag-darwin-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent bin/PwshDeck.app "$zip"
          shasum -a 256 "$zip" | awk '{print $1 "  " $2}' > "$zip.sha256"
          echo "Artifact: $zip"
          cat "$zip.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PwshDeck-${{ matrix.suffix }}
          path: |
            PwshDeck-*.zip
            PwshDeck-*.zip.sha256
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: PwshDeck-*
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
